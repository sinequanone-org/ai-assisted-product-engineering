name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check publication blockers
        run: python3 scripts/check-public-ready.py
